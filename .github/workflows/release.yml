name: Build and publish plugins

on:
  push:
    branches: [main]
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "src/**"
      - "manifests/**"
      - "plugins.json"
      - "scripts/**"
      - ".github/workflows/release.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.arch }} packages
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: x86_64
            target: x86_64-unknown-linux-gnu
          - runner: ubuntu-24.04-arm
            arch: aarch64
            target: aarch64-unknown-linux-gnu
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Check out plugin sources
        uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Build plugin processes
        run: cargo build --release --locked --target "${{ matrix.target }}" --bins
      - name: Package plugins
        run: |
          python3 scripts/build-packages.py \
            --target "${{ matrix.target }}" \
            --arch "${{ matrix.arch }}" \
            --output dist
      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: packages-${{ matrix.arch }}
          path: dist/*.zip
          if-no-files-found: error

  release:
    name: Publish per-plugin releases and catalog
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Download x86_64 packages
        uses: actions/download-artifact@v4
        with:
          name: packages-x86_64
          path: artifacts/x86_64
      - name: Download aarch64 packages
        uses: actions/download-artifact@v4
        with:
          name: packages-aarch64
          path: artifacts/aarch64
      - name: Publish one release per plugin
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/publish-releases.py \
            --artifacts artifacts \
            --repository "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA"
      - name: Generate release-backed catalog
        run: |
          python3 scripts/generate-index.py \
            --artifacts artifacts \
            --repository "$GITHUB_REPOSITORY" \
            --output index.json
      - name: Commit catalog
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.json
          git diff --cached --quiet || git commit -m "chore: update plugin catalog for per-plugin releases"
          git push origin HEAD:main
